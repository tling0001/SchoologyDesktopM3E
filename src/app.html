<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src 'self' https: blob:; connect-src 'self' https: http: blob:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schoology</title>
<link rel="stylesheet" href="styles.css">
<script>window.m3eReady = new Promise((resolve, reject) => { window.__resolveM3eReady = resolve; window.__rejectM3eReady = reject; });</script>
<script type="module">
  import('./m3e-bootstrap.js').catch((error) => {
    console.error('M3E bootstrap failed:', error);
    window.__rejectM3eReady?.(error);
    if (!window.__rejectM3eReady) {
      const message = document.createElement('pre');
      message.className = 'fatal';
      message.textContent = 'Material 3 Expressive could not initialize: ' + (error?.stack || error?.message || error);
      document.body.appendChild(message);
    }
  });
</script>
</head>
<body>
<div id="app"></div>
<m3e-theme class="splashM3eTheme" color="#2e66a3" variant="fidelity" scheme="light" motion="expressive"><div id="startupSplash" class="androidSplash appStartupSplash" aria-label="Loading Schoology"><img class="androidSplashLogo" src="../assets/schoology-logo-expressive-light.svg" alt="Schoology"><m3e-circular-progress-indicator indeterminate class="androidSplashSpinner m3eSplashProgress" aria-label="Loading"></m3e-circular-progress-indicator></div></m3e-theme>
<script src="appboot.js"></script>
</body>
</html>
